name: Release

# Pushing a tag like v0.1.0 builds the app on all three systems and publishes
# a GitHub release with the finished files attached.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release (e.g. v0.1.0); made on the chosen branch's latest commit"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, name: windows, bin: v-notch.exe, asset: v-notch-windows-x64.exe }
          - { os: ubuntu-latest, name: linux, bin: v-notch, asset: v-notch-linux-x64 }
          - { os: macos-latest, name: macos, bin: v-notch, asset: v-notch-macos-arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # A tag push builds that tag; a manual run builds the branch it was started on.
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libssl-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Build and test
        run: |
          cargo build --release --locked
          cargo test --release --locked

      - name: Rename
        run: cp "target/release/${{ matrix.bin }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: V-Notch ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*
